# XcodeGen — Camino Seguro Watch (watchOS, app independiente, sin app iOS).
#   brew install xcodegen && cd watchos && xcodegen generate
# El .xcodeproj y CaminoWatch/Info.plist se generan; no se versionan.
name: CaminoWatch

options:
  bundleIdPrefix: org.caminoseguro
  developmentLanguage: es
  deploymentTarget:
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CaminoCore:
    path: CaminoCore

targets:
  CaminoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CaminoWatch
        excludes:
          - Info.plist
          - CaminoWatch.entitlements
      # Instantánea para widgets: se compila en la app y en CaminoWidgets.
      - path: Shared
      # Fixtures compartidas por referencia (no se copian): datos de demostración.
      - path: ../shared/fixtures/stages.json
        buildPhase: resources
      - path: ../shared/fixtures/pois.json
        buildPhase: resources
    dependencies:
      - package: CaminoCore
        product: CaminoCore
      - package: CaminoCore
        product: CaminoDesign
      # Extensión WidgetKit (complicaciones / Smart Stack), embebida en la app.
      - target: CaminoWidgets
        embed: true
    info:
      path: CaminoWatch/Info.plist
      properties:
        CFBundleDisplayName: Camino Seguro
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: "Camino Seguro usa tu ubicación durante la etapa para medir la distancia recorrida y avisarte de puntos de interés cercanos. Tu ubicación no se envía a ningún servidor."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Camino Seguro usa tu ubicación mientras hay una etapa en curso, también con la pantalla apagada, para medir la distancia y avisarte de puntos de interés cercanos. Tu ubicación no se envía a ningún servidor."
        NSMotionUsageDescription: "Camino Seguro cuenta tus pasos durante la etapa con el sensor de movimiento del reloj."
        UIBackgroundModes:
          - location
        # Enlaces directos desde complicaciones, widgets y notificaciones (DeepLink en CaminoCore).
        CFBundleURLTypes:
          - CFBundleURLName: org.caminoseguro.watch.deeplink
            CFBundleURLSchemes:
              - caminoseguro
    settings:
      base:
        # Placeholder: sustituir por el identificador real del equipo antes de publicar.
        PRODUCT_BUNDLE_IDENTIFIER: org.caminoseguro.watch
        PRODUCT_NAME: CaminoWatch
        # App Group group.org.caminoseguro.watch (instantánea del widget). Requiere firma real.
        CODE_SIGN_ENTITLEMENTS: CaminoWatch/CaminoWatch.entitlements
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SKIP_INSTALL: NO
        ENABLE_PREVIEWS: YES
      configs:
        # Debug → MockCaminoApi (marca DEMO). Release → BlockedCaminoApi.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

  # Complicaciones / widgets "Mi etapa" (WidgetKit, watchOS 10+). Ver CaminoWidgets/README.md.
  CaminoWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CaminoWidgets
        excludes:
          - Info.plist
          - CaminoWidgets.entitlements
          - README.md
      - path: Shared
    dependencies:
      - package: CaminoCore
        product: CaminoCore
      - package: CaminoCore
        product: CaminoDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: CaminoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Camino Seguro
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # Debe empezar por el bundle id de la app contenedora.
        PRODUCT_BUNDLE_IDENTIFIER: org.caminoseguro.watch.widgets
        PRODUCT_NAME: CaminoWidgets
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CaminoWidgets/CaminoWidgets.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

schemes:
  CaminoWatch:
    build:
      targets:
        CaminoWatch: all
        CaminoWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
