name: watchOS

on:
  push:
    paths: ["watchos/**", "shared/**", ".github/workflows/watchos.yml"]
  pull_request:
    paths: ["watchos/**", "shared/**", ".github/workflows/watchos.yml"]
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: "Commitear las capturas en docs/screenshots/watchos de esta rama"
        type: boolean
        default: false

concurrency:
  group: watchos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: CaminoCore (swift test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Conformance + unit tests
        working-directory: watchos/CaminoCore
        run: swift test

  app:
    name: CaminoWatch (xcodebuild, simulador)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i watch || true
      - name: Localizable.strings al día
        run: python3 watchos/tools/gen_strings.py --check
      - name: XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: watchos
        run: xcodegen generate
      - name: Build (watchOS Simulator)
        working-directory: watchos
        run: |
          set -o pipefail
          xcodebuild build \
            -project CaminoWatch.xcodeproj \
            -scheme CaminoWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 200
      - name: Build Release (BlockedCaminoApi)
        working-directory: watchos
        run: |
          set -o pipefail
          xcodebuild build \
            -project CaminoWatch.xcodeproj \
            -scheme CaminoWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 200

  screenshots:
    name: Capturas (simulador, escenarios DEMO)
    needs: app
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i watch || true
      - name: XcodeGen + Pillow
        run: |
          brew install xcodegen
          python3 -m pip install --user --break-system-packages pillow \
            || python3 -m pip install --user pillow \
            || echo "Pillow no instalado; el script lo intentará en un venv"
      - name: Capturas
        working-directory: watchos
        run: bash scripts/screenshots.sh "$GITHUB_WORKSPACE/watchos/out"
      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: watchos/out
          if-no-files-found: warn
      # Sólo a petición (workflow_dispatch): deja las capturas versionadas en la rama para revisión.
      # Un push hecho con GITHUB_TOKEN no vuelve a disparar workflows.
      - name: Publicar capturas en la rama
        if: github.event_name == 'workflow_dispatch' && inputs.publish_screenshots
        run: |
          rm -rf docs/screenshots/watchos
          mkdir -p docs/screenshots/watchos
          find watchos/out -maxdepth 1 \( -name '*.png' -o -name 'index.md' \) -exec cp {} docs/screenshots/watchos/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/watchos
          git commit -m "Capturas watchOS del simulador (CI, escenarios DEMO) @ ${GITHUB_SHA::7}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
