name: Wear OS

on:
  push:
    paths: ["wearos/**", "shared/**", ".github/workflows/wearos.yml"]
  pull_request:
    paths: ["wearos/**", "shared/**", ".github/workflows/wearos.yml"]
  workflow_dispatch:

concurrency:
  group: wearos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: core tests + app build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core conformance + unit tests
        run: ./gradlew --no-daemon :core:test
      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble Debug + Release
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: wearos/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
